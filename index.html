<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stala's Gas — Business Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --ember:#d9590c;
    --ember-deep:#b9430a;
    --char:#241712;
    --char-soft:#3a2a22;
    --cream:#fbf2e6;
    --sand:#f0e1ca;
    --line:#e3cba8;
    --ok:#3f7d4f;
    --warn:#c98a1c;
    --danger:#b23a2e;
    --font-display:'Iowan Old Style','Georgia',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:var(--font-body);background:var(--cream);color:var(--char);
    min-height:100vh;
  }
  .flame{font-size:1.1em;}
  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%, #fff7ec 0%, var(--cream) 55%, var(--sand) 100%);
    padding:24px;
  }
  .login-card{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:40px 36px;max-width:380px;width:100%;
    box-shadow:0 20px 50px -20px rgba(36,23,18,0.25);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;background:linear-gradient(145deg,var(--ember),var(--ember-deep));
    display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;
  }
  .brand h1{font-family:var(--font-display);font-size:21px;margin:0;letter-spacing:0.3px;}
  .brand small{display:block;color:var(--char-soft);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
  .login-card h2{font-family:var(--font-display);font-size:17px;margin:24px 0 4px;color:var(--char-soft);font-weight:600;}
  .login-card p.sub{font-size:13px;color:#8a7565;margin:0 0 20px;}
  label{font-size:12px;font-weight:600;color:var(--char-soft);display:block;margin-bottom:5px;letter-spacing:0.3px;}
  input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;margin-bottom:14px;background:#fffdfa;color:var(--char);
  }
  input:focus{outline:2px solid var(--ember);outline-offset:1px;border-color:var(--ember);}
  button.primary{
    width:100%;padding:12px;border:none;border-radius:9px;background:var(--ember);
    color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.2px;
    transition:background .15s ease;
  }
  button.primary:hover{background:var(--ember-deep);}
  button.primary:disabled{opacity:0.55;cursor:default;}
  #login-error{color:var(--danger);font-size:13px;margin-top:10px;display:none;}
  .login-tabs{display:flex;gap:0;margin:18px 0 16px;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .login-tab{flex:1;padding:9px;border:none;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#8a7565;}
  .login-tab.active{background:var(--ember);color:#fff;}
  .pin-row{display:flex;gap:10px;margin-top:6px;}
  .pin-box{width:52px;height:58px;text-align:center;font-size:22px;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:0;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  header.topbar{
    background:var(--char);color:var(--sand);display:flex;align-items:center;
    justify-content:space-between;padding:14px 22px;position:sticky;top:0;z-index:10;
  }
  header.topbar .brand{margin:0;}
  header.topbar .brand h1{color:#fff;}
  header.topbar .brand small{color:#caa97e;}
  .who{display:flex;align-items:center;gap:12px;}
  .who .role-pill{
    font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;
    padding:4px 10px;border-radius:20px;background:var(--ember);color:#fff;
  }
  .who button{
    background:transparent;border:1px solid #5c473a;color:var(--sand);
    padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;
  }
  .who button:hover{background:#3a2a22;}

  main{max-width:1100px;margin:0 auto;padding:26px 20px 60px;}
  .stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
  .stat-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    flex:1;min-width:150px;
  }
  .stat-card .num{font-family:var(--font-display);font-size:28px;color:var(--ember-deep);}
  .stat-card .label{font-size:12px;color:#8a7565;text-transform:uppercase;letter-spacing:0.8px;margin-top:2px;}

  .panel{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px;
  }
  .panel h2{font-family:var(--font-display);font-size:18px;margin:0 0 16px;color:var(--char);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:#8a7565;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.5px;padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid #f0e6d6;}
  tr:hover td{background:#fdf8ef;}
  .status-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
  .status-Pending{background:#fbe8c8;color:var(--warn);}
  .status-Assigned{background:#e3edff;color:#2d5fae;}
  .status-OutforDelivery{background:#fde3c0;color:var(--ember-deep);}
  .status-Delivered{background:#e1f0e2;color:var(--ok);}
  .status-Cancelled{background:#f6dcd8;color:var(--danger);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  @media print{
    header.topbar, .tab-nav, .who, #notif-bell, #notif-panel,
    button, select, input, .btn-small, #wa-send-box{ display:none !important; }
    body{ background:#fff; }
    .panel{ box-shadow:none; border:1px solid #ccc; }
    main{ padding:0; }
  }

  /* ---- MOBILE OPTIMISATION ---- */
  @media (max-width:600px){
    header.topbar{padding:10px 14px;}
    header.topbar .brand h1{font-size:15px;}
    .who button{padding:6px 10px;font-size:12px;}
    main{padding:14px 12px 60px;}
    .stat-row{gap:10px;}
    .stat-card{min-width:120px;padding:14px 14px;}
    .stat-card .num{font-size:22px;}
    .tab-nav{gap:2px;overflow-x:auto;padding-bottom:2px;flex-wrap:nowrap;}
    .tab-btn{padding:8px 12px;font-size:12px;white-space:nowrap;}
    .panel{padding:14px 12px;}
    table{font-size:12px;}
    th,td{padding:7px 6px;}
    .login-card{padding:28px 20px;}
    .pin-row{gap:8px;}
    .pin-box{width:44px;height:50px;font-size:20px;}
    button.primary{font-size:13px;}
    /* Make driver delivery cards tap-friendly */
    .btn-small{padding:9px 14px;font-size:13px;}
    /* Stack driver action buttons */
    [style*="display:flex;gap:8px;flex-wrap:wrap"] button,
    [style*="display:flex;gap:8px;flex-wrap:wrap"] a{
      flex:1;text-align:center;min-width:120px;
    }
    #notif-panel{width:calc(100vw - 32px);right:8px;}
  }
  select{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;background:#fffdfa;color:var(--char);
  }
  .btn-small{padding:6px 12px;font-size:12px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .btn-small:hover{background:var(--sand);}
  .empty-state{color:#a08e7c;font-size:13px;padding:20px 0;text-align:center;}
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--char);color:#fff;padding:13px 20px;
    border-radius:10px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,0.4);display:none;z-index:50;
  }
  .tab-nav{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--line);}
  .tab-btn{
    background:transparent;border:none;padding:10px 18px;font-size:14px;font-weight:600;
    color:#8a7565;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;
  }
  .tab-btn:hover{color:var(--char);}
  .tab-btn.active{color:var(--ember-deep);border-bottom-color:var(--ember);}

  /* INVOICE MODAL */
  #invoice-modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;
    align-items:center;justify-content:center;padding:20px;
  }
  #invoice-modal.open{display:flex;}
  #invoice-inner{
    background:#fff;border-radius:16px;padding:32px 28px;max-width:480px;width:100%;
    max-height:90vh;overflow-y:auto;position:relative;
  }
  #invoice-close{
    position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#8a7565;
  }
  @media print{
    body > *:not(#invoice-modal){ display:none !important; }
    #invoice-modal{ position:static;background:none;padding:0;display:block !important; }
    #invoice-inner{ box-shadow:none;border-radius:0;max-height:none; }
    #invoice-close, #invoice-print-btn{ display:none !important; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">🔥</div>
      <div>
        <h1>Stala's Gas</h1>
        <small>Business Manager</small>
      </div>
    </div>

    <div class="login-tabs">
      <button class="login-tab active" id="tab-staff-btn">Staff</button>
      <button class="login-tab" id="tab-admin-btn">Admin</button>
    </div>

    <!-- STAFF PIN LOGIN -->
    <div id="staff-login">
      <label for="staff-select">Your name</label>
      <select id="staff-select">
        <option value="">Select your name…</option>
      </select>
      <label style="margin-top:12px;">PIN</label>
      <div class="pin-row">
        <input class="pin-box" id="p1" type="password" inputmode="numeric" maxlength="1">
        <input class="pin-box" id="p2" type="password" inputmode="numeric" maxlength="1">
        <input class="pin-box" id="p3" type="password" inputmode="numeric" maxlength="1">
        <input class="pin-box" id="p4" type="password" inputmode="numeric" maxlength="1">
      </div>
      <button class="primary" id="staff-login-btn" style="margin-top:16px;">Sign in</button>
    </div>

    <!-- ADMIN EMAIL LOGIN -->
    <div id="admin-login" style="display:none;">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="you@stala.co.za" autocomplete="username">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="primary" id="login-btn" style="margin-top:4px;">Sign in</button>
    </div>

    <div id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" style="width:32px;height:32px;font-size:16px;">🔥</div>
      <div><h1 style="font-size:17px;">Stala's Gas</h1></div>
    </div>
    <div class="who">
      <span id="who-name"></span>
      <span class="role-pill" id="who-role"></span>
      <div id="notif-bell" style="display:none;position:relative;cursor:pointer;align-items:center;" title="New orders">
        <span style="font-size:20px;">🔔</span>
        <span id="notif-count" style="
          position:absolute;top:-6px;right:-8px;background:var(--ember);color:#fff;
          border-radius:20px;font-size:10px;font-weight:700;padding:2px 6px;min-width:16px;text-align:center;
        ">0</span>
      </div>
      <button id="logout-btn">Log out</button>
    </div>
  </header>

  <!-- NOTIFICATION PANEL -->
  <div id="notif-panel" style="
    display:none;position:fixed;top:58px;right:16px;width:320px;max-height:400px;overflow-y:auto;
    background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -10px rgba(0,0,0,0.2);
    z-index:100;padding:16px;
  ">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <strong style="font-size:14px;">New orders</strong>
      <button id="notif-clear" style="font-size:12px;color:var(--ember);background:none;border:none;cursor:pointer;">Clear all</button>
    </div>
    <div id="notif-list"></div>
  </div>

  <main id="main-content">
    <div class="empty-state">Loading…</div>
  </main>

  <!-- INVOICE MODAL -->
  <div id="invoice-modal">
    <div id="invoice-inner">
      <button id="invoice-close">✕</button>
      <div id="invoice-content"></div>
      <button class="primary" id="invoice-print-btn" style="margin-top:20px;max-width:200px;">🖨 Print / Save PDF</button>
    </div>
  </div>

  <!-- STATUS TIMELINE MODAL -->
  <div id="timeline-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;align-items:center;justify-content:center;padding:20px;">
    <div style="background:#fff;border-radius:16px;padding:28px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;position:relative;">
      <button id="timeline-close" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#8a7565;">✕</button>
      <h2 style="font-family:var(--font-display);font-size:18px;margin:0 0 16px;" id="timeline-title">Order history</h2>
      <div id="timeline-content"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = "https://kaqrxufvvyljpdtnwowj.supabase.co";
const SUPABASE_KEY = "sb_publishable_FK3b49UnfyeMxKpcL0v92w_p0Lf5brf";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const EMAILJS_PUBLIC_KEY = "UuKKnY5gfgBQ3bq0";
const EMAILJS_SERVICE_ID = "service_8eq8kp4";
const EMAILJS_TEMPLATE_ID = "template_8oetxyw";
const WHATSAPP_NUMBER = "27725744458"; // 072 574 4458 in international format, no +
const NOTIFY_EMAIL = "info@stala.co.za";
emailjs.init(EMAILJS_PUBLIC_KEY);

const CYL_SIZES = ['3kg','5kg','7kg','9kg','14kg','19kg','48kg'];
const ORDER_TYPES = ['Exchange','Refill','Cylinder Only','Gas and Cylinder'];
const STATUSES = ['Pending','Assigned','Out for Delivery','Delivered','Cancelled'];

let currentProfile = null;
let priceList = {}; // { '9kg': 250.00, ... }

async function loadPrices(){
  const { data, error } = await sb.from('prices').select('*');
  if(!error && data){
    priceList = {};
    data.forEach(p => priceList[`${p.order_type}|${p.cylinder_size}`] = parseFloat(p.price));
  }
}

function showToast(msg, isError=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#b23a2e' : '#241712';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 3200);
}

/* ============ ORDER STATUS TIMELINE ============ */
async function showTimeline(order){
  const modal = document.getElementById('timeline-modal');
  const content = document.getElementById('timeline-content');
  const title = document.getElementById('timeline-title');
  title.textContent = `Order #${order.order_number||(1000+order.id)} — ${order.customer_name}`;
  content.innerHTML = `<div class="empty-state">Loading…</div>`;
  modal.style.display = 'flex';

  const { data: history, error } = await sb.from('order_status_history')
    .select('*').eq('order_id', order.id).order('created_at', { ascending: true });

  const initialEntry = {
    new_status: order.status === 'Pending' ? 'Order created' : null,
    old_status: null,
    changed_by_name: 'System',
    created_at: order.created_at
  };

  const entries = [
    { new_status: 'Order created', changed_by_name: '', created_at: order.created_at },
    ...(history||[])
  ];

  content.innerHTML = entries.map((h, i)=>{
    const isLast = i === entries.length - 1;
    const statusColor = h.new_status === 'Delivered' ? 'var(--ok)'
      : h.new_status === 'Cancelled' ? 'var(--danger)'
      : h.new_status === 'Order created' ? 'var(--ember)' : 'var(--char)';
    return `
      <div style="display:flex;gap:14px;margin-bottom:${isLast?'0':'16px'};">
        <div style="display:flex;flex-direction:column;align-items:center;">
          <div style="width:12px;height:12px;border-radius:50%;background:${statusColor};flex-shrink:0;margin-top:3px;"></div>
          ${!isLast?`<div style="width:2px;flex:1;background:var(--line);margin-top:4px;"></div>`:''}
        </div>
        <div style="padding-bottom:${isLast?'0':'4px'};">
          <div style="font-weight:600;font-size:13px;color:${statusColor};">${h.new_status}</div>
          <div style="font-size:12px;color:#8a7565;">${new Date(h.created_at).toLocaleString('en-ZA')}${h.changed_by_name?' · '+h.changed_by_name:''}</div>
          ${h.note?`<div style="font-size:12px;color:var(--char-soft);margin-top:2px;">${h.note}</div>`:''}
        </div>
      </div>
    `;
  }).join('');
}

/* ============ QUICK REORDER ============ */
function quickReorder(order){
  // Switch to orders tab and pre-fill form
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');
  document.querySelector('.tab-btn[data-tab="orders"]')?.classList.add('active');
  document.getElementById('tab-orders').style.display='block';
  // Pre-fill fields after a tick to let the DOM settle
  setTimeout(()=>{
    const set = (id, val) => { const el = document.getElementById(id); if(el) el.value = val; };
    set('f-name', order.customer_name);
    set('f-phone', order.customer_phone);
    set('f-address', order.delivery_address||'');
    set('f-type', order.order_type);
    set('f-size', order.cylinder_size);
    set('f-qty', order.quantity);
    set('f-amount', parseFloat(order.amount||0).toFixed(2));
    set('f-payment', order.payment_method||'');
    set('f-notes', order.delivery_notes||'');
    document.getElementById('f-name')?.scrollIntoView({behavior:'smooth'});
    showToast(`Form pre-filled for ${order.customer_name} — check and save.`);
  }, 100);
}

/* ============ INVOICE / RECEIPT ============ */
function showInvoice(order){
  const modal = document.getElementById('invoice-modal');
  const content = document.getElementById('invoice-content');
  const orderNum = order.order_number||(1000+order.id);
  const date = new Date(order.created_at).toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'});
  content.innerHTML = `
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:28px;">🔥</div>
      <h2 style="font-family:var(--font-display);margin:4px 0;font-size:22px;">Stala's Gas</h2>
      <div style="font-size:12px;color:#8a7565;">Cape Town · 072 574 4458 · info@stala.co.za</div>
    </div>
    <div style="border-top:2px solid var(--char);border-bottom:2px solid var(--char);padding:10px 0;margin:16px 0;display:flex;justify-content:space-between;">
      <div><strong>Receipt #${orderNum}</strong></div>
      <div style="color:#8a7565;">${date}</div>
    </div>
    <table style="width:100%;font-size:14px;">
      <tr><td style="padding:5px 0;color:#8a7565;">Customer</td><td style="text-align:right;">${order.customer_name}</td></tr>
      <tr><td style="padding:5px 0;color:#8a7565;">Phone</td><td style="text-align:right;">${order.customer_phone}</td></tr>
      ${order.delivery_address?`<tr><td style="padding:5px 0;color:#8a7565;">Address</td><td style="text-align:right;">${order.delivery_address}</td></tr>`:''}
      <tr><td colspan="2"><hr style="border:none;border-top:1px solid var(--line);margin:8px 0;"></td></tr>
      <tr><td style="padding:5px 0;color:#8a7565;">Order type</td><td style="text-align:right;">${order.order_type}</td></tr>
      <tr><td style="padding:5px 0;color:#8a7565;">Cylinder size</td><td style="text-align:right;">${order.cylinder_size}</td></tr>
      <tr><td style="padding:5px 0;color:#8a7565;">Quantity</td><td style="text-align:right;">${order.quantity}</td></tr>
      <tr><td style="padding:5px 0;color:#8a7565;">Payment</td><td style="text-align:right;">${order.payment_method||'—'}</td></tr>
      ${order.delivery_
